services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - ./data/migrations:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data

  kyc-api:
    build: ./services/kyc-api
    environment:
      DATABASE_URL: postgresql+psycopg2://aegis:aegis_dev_pw@postgres:5432/aegis
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  pgdata:
